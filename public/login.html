<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vortis Media - Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0e27; color: #e0e0e0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-card { background: #141832; border: 1px solid #1e2345; border-radius: 16px; padding: 48px 40px; width: 100%; max-width: 420px; }
    .logo { text-align: center; margin-bottom: 32px; }
    .logo h1 { font-size: 1.8rem; font-weight: 800; color: #fff; letter-spacing: 2px; }
    .logo p { color: #8b8fa3; margin-top: 6px; font-size: 0.85rem; }
    h2 { color: #fff; font-size: 1.1rem; margin-bottom: 8px; }
    .subtitle { color: #8b8fa3; font-size: 0.85rem; margin-bottom: 24px; }
    label { display: block; font-size: 0.85rem; color: #b0b4cc; margin-bottom: 6px; font-weight: 500; }
    input { width: 100%; padding: 14px 16px; background: #0d1025; border: 1px solid #2a2f52; border-radius: 8px; color: #fff; font-size: 0.95rem; }
    input:focus { outline: none; border-color: #4f6ef7; }
    .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #4f6ef7, #3b5de7); border: none; border-radius: 10px; color: #fff; font-weight: 600; cursor: pointer; font-size: 0.95rem; margin-top: 16px; }
    .btn:hover { box-shadow: 0 4px 20px rgba(79,110,247,0.3); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .error { background: #2d1515; border: 1px solid #5a2020; padding: 12px; border-radius: 8px; color: #ff6b6b; font-size: 0.85rem; margin-bottom: 16px; display: none; }
    .error.show { display: block; }
    .footer-link { text-align: center; margin-top: 20px; }
    .footer-link a { color: #4f6ef7; text-decoration: none; font-size: 0.8rem; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">
      <h1>VORTIS MEDIA</h1>
      <p>Panel Interno</p>
    </div>
    <h2>Iniciá sesión</h2>
    <p class="subtitle">Ingresá la contraseña de admin para acceder al panel.</p>

    <div class="error" id="errorMsg"></div>

    <form id="loginForm">
      <label>Contraseña</label>
      <input type="password" id="password" autofocus required placeholder="••••••••">
      <button type="submit" class="btn" id="btnLogin">Ingresar</button>
    </form>

    <div class="footer-link">
      <a href="/">← Volver al onboarding público</a>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('btnLogin');
      const err = document.getElementById('errorMsg');
      err.classList.remove('show');
      btn.disabled = true;
      btn.textContent = 'Ingresando...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        });
        const data = await res.json();
        if (data.success) {
          window.location.href = '/panel';
        } else {
          err.textContent = data.error || 'Error';
          err.classList.add('show');
          btn.disabled = false;
          btn.textContent = 'Ingresar';
        }
      } catch (e) {
        err.textContent = 'Error de conexión';
        err.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Ingresar';
      }
    });
  </script>
</body>
</html>
